# =====================================================================
# Manifeste des versions — SOURCE UNIQUE DE VÉRITÉ du build (ADR-002).
# RÈGLE : toute modification de ce fichier = revue + tests CI bloquants.
#
# Figeage effectué le 2026-11-25 par interrogation directe de l'API
# publique de quay.io (endpoint : /api/v1/repository/fedora/fedora-kinoite/tag/).
# Le tag « 45 » désignait alors la version stable courante de Fedora
# Kinoite (Atomic Desktop KDE), manifest-list mis à jour par l'amont le
# 2026-11-25 02:03 UTC. Fedora 44 reste publié en parallèle ; 46 = rawhide.
# =====================================================================

base:
  registry: quay.io
  repository: fedora/fedora-kinoite
  tag: "45"
  # Digest du manifest-list (multi-arch) au moment du figeage :
  #   - 2026-11-25 : sha256:79f701ea… (GC par quay le 26/11)
  #   - 2026-11-26 (rebase 1) : sha256:72c24fe7… (GC par quay le 27/11)
  #   - 2026-11-27 (rebase 2) : sha256:2c821511… (GC quelques heures après)
  #   - 2026-11-28 (rebase 3) : sha256:2056806eae5152bfb613798e9f41e98e8195b61a818d68fafd9bbcf13ef63cc4
  digest: "sha256:2056806eae5152bfb613798e9f41e98e8195b61a818d68fafd9bbcf13ef63cc4"
  arch_target: x86_64        # cible v1 (doc 02) — aarch64 également publié par l'amont
  verified_at: "2026-11-28"
  notes: >
    Fedora Kinoite = Atomic Desktop officiel KDE de Fedora, géré bootc
    (Image Mode). La CI construit TOUJOURS par digest (reproductibilité) ;
    un contrôleur de dérive compare le tag vivant au digest figé et alerte
    quand l'amont avance (fenêtre de rebase, doc 09). REBASE du 26/11 :
    l'amont a mis à jour le tag 45 (nouveau digest ci-dessus) et le GC de
    quay a retiré l'ancien manifest → mise à jour du présent manifeste,
    suivie de la relance de la fenêtre de tests complète (doc 09).
    RÈGLE DE VIE DU PROJET : les images amont Fedora sont mises à jour
    régulièrement ; le rebase est une opération NORMALE du cycle de
    maintenance (elle suit les correctifs de sécurité Fedora).

image:
  name: hybridos/base
  version: "0.1.0-alpha.1"
  phase: alpha-0.1-step1
