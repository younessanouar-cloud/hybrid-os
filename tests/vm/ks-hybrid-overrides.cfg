# =====================================================================
# HYBRID OS — overrides kickstart v8 (APPEND au osbuild.ks officiel)
# =====================================================================
# Le kickstart OFFICIEL de l'ISO (osbuild.ks) installe L'IMAGE EMBARQUÉE
# (directive bootc/ostreecontainer). Ces overrides y ajoutent UNIQUEMENT
# les personnalisations HYBRID. RÈGLES d'usage (cahier des charges §8) :
# machine virtuelle de test à disque VIERGE uniquement ; le dual boot
# réel sera géré par l'installateur dédié (Phase 5), jamais par kickstart.
# =====================================================================

# --- Comptes (root verrouillé, user non privilégié — doc 06) ---
rootpw --lock
user --name=hybride --password=hybrios01 --groups=wheel

# --- Localisation française (le greeter SDDM suit le locale système) ---
lang fr_FR.UTF-8
keyboard fr
timezone Europe/Paris

# --- Services (pare-feu laissé par défaut actif — doc 06) ---
services --enabled=sshd

# --- %post : cible graphique (fix v7/v8) ---
#     Le diagnostic des runs v2-v7 a prouvé : sans %post, Anaconda mode
#     text laisse le système en multi-user sans greeter.
#     v12 : l'alias display-manager -> sddm est défini DANS L'IMAGE
#     (section 9 du Containerfile) — le %post n'y touche plus (conflit
#     plasmalogin évité). Le first-setup OPALE (XDG autostart) s'exécutera
#     dans la session AUTLOGUÉE pour appliquer le look-and-feel + wallpaper.
%post
systemctl set-default graphical.target
%end
