# =====================================================================
# HYBRID OS — kickstart Alpha 0.1 (VM DE TEST UNIQUEMENT)
# =====================================================================
# Source de la méthode : documentation officielle Fedora « Installing
# Fedora/CentOS bootc on Bare Metal » (exemple kickstart ostreecontainer)
# + Fedora Magazine « Introducing the new bootc kickstart command »
# (vérifiés le 25/11/2026).
#
# ⚠ RÈGLES D'USAGE (cahier des charges §8) :
#   - Ce kickstart est destiné UNIQUEMENT aux machines virtuelles de
#     test dont le disque est VIERGE (créé par le script de test).
#   - « clearpart --all » n'existe QUE pour ce cas. TOUT usage sur
#     disque réel / dual boot est INTERDIT à ce stade du projet :
#     le dual boot réel sera géré par l'installateur dédié (Phase 5,
#     doc 05) avec confirmation explicite, jamais par kickstart.
#
# Particularité bootc : l'image installée est CELLE EMBARQUÉE dans
# l'ISO anaconda-iso (image conteneur) → AUCUNE section %packages.
# =====================================================================

text
network --bootproto=dhcp --device=link --activate

# --- Partitionnement GPT/UEFI (disque virtuel vierge uniquement) ---
clearpart --all --initlabel --disklabel=gpt
reqpart --add-boot
part / --grow --fstype xfs

# --- Comptes (sécurité doc 06 : root verrouillé, user non privilégié) ---
rootpw --lock
user --name=hybride --password=hybrios01 --groups=wheel

# --- Services (pare-feu : NON désactivé — défaut Fedora actif, doc 06) ---
services --enabled=sshd

reboot
